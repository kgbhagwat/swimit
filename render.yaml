# Render Blueprint — deploy SwimIT SaaS
# https://render.com/docs/blueprint-spec
# Domain: swimit.co.in

services:
  - type: web
    name: swimit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    domains:
      - swimit.co.in
      - www.swimit.co.in
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://swimit.co.in
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swimit-db
          property: connectionString

databases:
  - name: swimit-db
    plan: free
    databaseName: swimit
    user: swimit
