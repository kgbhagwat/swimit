# Render Blueprint — deploy SwimIT SaaS
# https://render.com/docs/blueprint-spec
# Connect this GitHub repo in Render and use "Blueprint"

services:
  - type: web
    name: swimit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: swimit-db
          property: connectionString

databases:
  - name: swimit-db
    plan: free
    databaseName: swimit
    user: swimit
