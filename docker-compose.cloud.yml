# Full SwimIT stack for cloud / local production-like run.
# Usage: docker compose -f docker-compose.cloud.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swimit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swimit}
      POSTGRES_DB: ${POSTGRES_DB:-swimit}
    volumes:
      - swimit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-swimit}:${POSTGRES_PASSWORD:-swimit}@db:5432/${POSTGRES_DB:-swimit}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
    volumes:
      - swimit_uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  swimit_pgdata:
  swimit_uploads:
